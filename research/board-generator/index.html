input[type=range]{width:100%}.v{float:right;color:var(--ink)}

#sel{border-top:1px solid var(--ln);margin-top:12px;padding-top:6px}
@media(max-width:760px){body{flex-direction:column}#side{width:100%;max-height:none;border:0}#board{height:auto;width:100%}}
@media print{@page{size:700mm 1000mm;margin:0}body{display:block;background:#fff}#side{display:none}#main{padding:0;display:block}#board{width:700mm;height:1000mm;box-shadow:none}}

const rows=(a,hs,cnt,r)=>{const T=hs.reduce((p,c)=>p+c,0);let y=a.y,o=[];hs.forEach((h,i)=>{const H2=a.h*h/T,k=cnt[i];let ws=Array.from({length:k},()=>wq(r)),S2=ws.reduce((p,c)=>p+c,0),x=a.x;ws.forEach(w=>{o.push({x,y,w:a.w*w/S2,h:H2});x+=a.w*w/S2});y+=H2});return o};

ls.slice(0,Math.max(1,mxl)).forEach((l,j)=>{o+=`<text x="${q.x}" y="${q.y+fs*1.5+j*fs*1.35}" font-size="${fs*(j==0?1.25:1)}" font-weight="${j==0?700:400}">${esc(l)}</text>`})}

const m=S.margin,footOn=$("footOn").checked,fy=H-m-40,sy=footOn?fy+10:H-m-30;

function draw(){$("board").innerHTML=render(true)}
function svgOut(){const b=$("board").cloneNode(false);b.innerHTML=render(false);b.setAttribute("width","700mm");b.setAttribute("height","1000mm");b.removeAttribute("id");b.removeAttribute("style");return'<?xml version="1.0" encoding="UTF-8"?>\n'+b.outerHTML.replace(/\sdata-i="\d+"/g,"")}
async function save(name,data){try{if(window.claude){const d=await claude.use("downloads");if(d){await d.save({filename:name,data});return}}}catch(e){if(e&&e.code=="declined")return}
